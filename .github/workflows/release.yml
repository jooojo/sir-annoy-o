name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve release metadata
        id: metadata
        shell: zsh {0}
        run: |
          set -euo pipefail

          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)"
          expected_tag="v${version}"
          release_tag="$expected_tag"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ "$release_tag" != "$expected_tag" ]]; then
            print -u2 -- "Tag $release_tag does not match app version $version (expected $expected_tag)."
            exit 1
          fi

          archive_name="AnnoyO-${release_tag}-macOS.zip"
          {
            print -- "version=$version"
            print -- "tag=$release_tag"
            print -- "archive_name=$archive_name"
            print -- "checksum_name=${archive_name}.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: |
          swift --version
          xcrun swift-format --version
          gh --version

      - name: Run offline checks
        run: ./scripts/check.sh

      - name: Build application bundle
        run: ./scripts/build-app.sh

      - name: Package and verify application
        run: ./scripts/package-release.sh "${{ steps.metadata.outputs.tag }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: AnnoyO-${{ steps.metadata.outputs.version }}-macOS
          path: |
            release/${{ steps.metadata.outputs.archive_name }}
            release/${{ steps.metadata.outputs.checksum_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/${{ steps.metadata.outputs.archive_name }}#macOS application (ad-hoc signed)" \
            "release/${{ steps.metadata.outputs.checksum_name }}#SHA-256 checksum" \
            --verify-tag \
            --title "AnnoyO ${{ steps.metadata.outputs.version }}" \
            --generate-notes \
            --notes "The attached macOS application is ad-hoc signed and has not been notarized by Apple. Verify the SHA-256 checksum before running it."
